org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# RedPiano mod toolchain — TARGET MC VERSION lives here (build.gradle reads these).
# Default = the 1.21.8 anchor (unedited build is byte-identical to before).
# Retarget for another supported version (1.21..1.21.9) with:
#   python ../../minecraft-redstone-music/scripts/mod_build.py --mc-version <v> --write
# (that also rewrites the fabric-loom plugin version line in build.gradle.)
minecraft_version=1.21.8
loader_version=0.17.3
fabric_version=0.136.1+1.21.8
java_version=21
